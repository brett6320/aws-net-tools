name: sg_effect tests

on:
  push:
    branches: [main]
    paths:
      - "tools/sg_effect/**"
      - ".github/workflows/tests-sg_effect.yml"
      - ".github/workflows/_python-tests.yml"
      - ".github/scripts/test_report.py"
      - ".github/coveragerc"
  pull_request:
    branches: [main]
    paths:
      - "tools/sg_effect/**"
      - ".github/workflows/tests-sg_effect.yml"
      - ".github/workflows/_python-tests.yml"
      - ".github/scripts/test_report.py"
      - ".github/coveragerc"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/_python-tests.yml
    with:
      name: sg_effect
      path: tools/sg_effect
    permissions:
      contents: write
