name: firewall tests

on:
  push:
    branches: [main]
    paths:
      - "tools/firewall/**"
      - ".github/workflows/tests-firewall.yml"
      - ".github/workflows/_python-tests.yml"
      - ".github/scripts/test_report.py"
      - ".github/coveragerc"
  pull_request:
    branches: [main]
    paths:
      - "tools/firewall/**"
      - ".github/workflows/tests-firewall.yml"
      - ".github/workflows/_python-tests.yml"
      - ".github/scripts/test_report.py"
      - ".github/coveragerc"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/_python-tests.yml
    with:
      name: firewall
      path: tools/firewall
    permissions:
      contents: write
