name: common tests

on:
  push:
    branches: [main]
    paths:
      - "tools/common/**"
      - ".github/workflows/tests-common.yml"
      - ".github/workflows/_python-tests.yml"
      - ".github/scripts/test_report.py"
      - ".github/coveragerc"
  pull_request:
    branches: [main]
    paths:
      - "tools/common/**"
      - ".github/workflows/tests-common.yml"
      - ".github/workflows/_python-tests.yml"
      - ".github/scripts/test_report.py"
      - ".github/coveragerc"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/_python-tests.yml
    with:
      name: common
      path: tools/common
    permissions:
      contents: write
