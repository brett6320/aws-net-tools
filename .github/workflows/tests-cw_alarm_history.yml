name: cw_alarm_history tests

on:
  push:
    branches: [main]
    paths:
      - "tools/cw_alarm_history/**"
      - ".github/workflows/tests-cw_alarm_history.yml"
      - ".github/workflows/_python-tests.yml"
      - ".github/scripts/test_report.py"
      - ".github/coveragerc"
  pull_request:
    branches: [main]
    paths:
      - "tools/cw_alarm_history/**"
      - ".github/workflows/tests-cw_alarm_history.yml"
      - ".github/workflows/_python-tests.yml"
      - ".github/scripts/test_report.py"
      - ".github/coveragerc"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/_python-tests.yml
    with:
      name: cw_alarm_history
      path: tools/cw_alarm_history
    permissions:
      contents: write
