name: proxy_inventory tests

on:
  push:
    branches: [main]
    paths:
      - "tools/proxy_inventory/**"
      - ".github/workflows/tests-proxy_inventory.yml"
      - ".github/workflows/_python-tests.yml"
      - ".github/scripts/test_report.py"
      - ".github/coveragerc"
  pull_request:
    branches: [main]
    paths:
      - "tools/proxy_inventory/**"
      - ".github/workflows/tests-proxy_inventory.yml"
      - ".github/workflows/_python-tests.yml"
      - ".github/scripts/test_report.py"
      - ".github/coveragerc"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/_python-tests.yml
    with:
      name: proxy_inventory
      path: tools/proxy_inventory
    permissions:
      contents: write
